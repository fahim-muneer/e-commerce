<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missing Hardware - E-commerce Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Keyframes for Animation */
        @keyframes tumble-screw {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5px, -5px) rotate(90deg); }
            75% { transform: translate(-5px, 5px) rotate(180deg); }
        }

        @keyframes frame-jiggle {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(2px); }
            40% { transform: translateX(-2px); }
            60% { transform: translateX(2px); }
            80% { transform: translateX(-2px); }
        }

        .animate-tumble-screw { animation: tumble-screw 4s linear infinite; }
        .animate-frame-jiggle { animation: frame-jiggle 0.2s ease-in-out infinite; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; opacity: 0; }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4 text-gray-200">

    <div class="max-w-4xl w-full flex flex-col md:flex-row items-center justify-center bg-gray-800 p-8 md:p-16 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-yellow-700/50 animate-fade-in">

        <!-- Illustration Area (Broken Wooden Frame & Missing Screw) -->
        <div class="md:w-1/2 flex justify-center items-center mb-10 md:mb-0 md:pr-12">
            <div class="relative w-full max-w-[300px] h-64">
                
                <!-- Wooden Frame Structure (The failed product) -->
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-48 h-40 bg-yellow-900 rounded-lg shadow-xl animate-frame-jiggle border-4 border-yellow-700">
                    <!-- Vertical support 1 (slightly tilted) -->
                    <div class="absolute bottom-0 left-4 w-4 h-32 bg-yellow-800 -rotate-3 origin-bottom-left shadow-inner"></div>
                    <!-- Vertical support 2 -->
                    <div class="absolute bottom-0 right-4 w-4 h-32 bg-yellow-800 rotate-3 origin-bottom-right shadow-inner"></div>
                    <!-- Horizontal support (broken in the middle) -->
                    <div class="absolute top-16 left-0 w-full h-4 bg-yellow-700 border-t-2 border-b-2 border-yellow-900">
                        <!-- Gap simulating breakage -->
                        <div class="absolute left-1/2 -translate-x-1/2 w-2 h-full bg-red-600 rounded-sm"></div>
                    </div>
                </div>

                <!-- Missing Screw/Bolt (Tumbling) -->
                <div class="absolute top-1/2 left-[calc(50%+15px)] transform -translate-x-1/2 -translate-y-1/2 w-8 h-8 z-20 animate-tumble-screw origin-center">
                    <!-- Screw shape (cross-hatch) -->
                    <svg class="w-full h-full text-gray-400" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M11 1.996C5.558 1.996 1.002 6.552 1.002 11.996C1.002 17.439 5.558 21.996 11 21.996C16.442 21.996 20.998 17.439 20.998 11.996C20.998 6.552 16.442 1.996 11 1.996ZM11 20.016C6.671 20.016 3.002 16.347 3.002 11.996C3.002 7.644 6.671 3.976 11 3.976C15.329 3.976 18.998 7.644 18.998 11.996C18.998 16.347 15.329 20.016 11 20.016Z"/>
                        <rect x="10" y="5" width="2" height="14" rx="1"/>
                        <rect x="5" y="10" width="14" height="2" rx="1"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Message Content -->
        <div class="md:w-1/2 text-center md:text-left">
            <p class="text-red-500 text-lg font-bold uppercase mb-2">Structural Integrity Compromised</p>
            <h1 class="text-4xl font-extrabold tracking-tighter text-white mb-4">
                Critical Assembly Failure!
            </h1>
            <h2 class="text-xl font-medium mb-6 text-yellow-500">
                It appears we lost somthing.
            </h2>
            
                        {% if messages %}
                        <div class="space-y-3 mb-4"> 
                            {% for message in messages %}
                                {% if 'error_handler' in message.tags  %}
                                    <div 
                                        x-data="{ show: true }" 
                                        x-init="setTimeout(() => { show = false }, 4000)" 
                                        x-show="show" 
                                        x-transition:enter="transition ease-out duration-300" 
                                        x-transition:leave="transition ease-in duration-200" 
                                        
                                        {% if message.tags == 'success' %}
                                            class="flex items-start justify-between p-3 bg-green-100 text-green-800 border border-green-300 rounded-lg shadow-sm"
                                        {% elif message.tags == 'error' %}
                                            class="flex items-start justify-between p-3 bg-red-100 text-red-800 border border-red-300 rounded-lg shadow-sm"
                                        {% elif message.tags == 'warning' %}
                                            class="flex items-start justify-between p-3 bg-yellow-100 text-yellow-800 border border-yellow-300 rounded-lg shadow-sm"
                                        {% else %}
                                            class="flex items-start justify-between p-3 bg-blue-100 text-blue-800 border border-blue-300 rounded-lg shadow-sm"
                                        {% endif %}
                                        
                                        role="alert"
                                    >
                                        <div class="flex items-start space-x-2">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mt-0.5 flex-shrink-0" 
                                                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                                    d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                            </svg>
                                            <span class="font-medium text-sm">{{ message }}</span>
                                        </div>

                                        <button 
                                            @click="show = false" 
                                            class="ml-3 hover:text-black text-xl font-bold leading-none focus:outline-none"
                                            title="Close"
                                        >
                                            &times;
                                        </button>
                                    </div>
                                {% endif %}
                            {% endfor %}
                        </div>
                        {% endif %}





            <!-- Call-to-Action Buttons -->
            <div class="flex flex-col sm:flex-row justify-center md:justify-start space-y-4 sm:space-y-0 sm:space-x-4">
                {% comment %} <a href="/" class="px-8 py-4 text-lg font-semibold text-gray-900 bg-yellow-500 rounded-xl hover:bg-yellow-600 transition duration-300 shadow-lg shadow-yellow-500/30 transform hover:scale-[1.03] active:scale-[0.98] focus:outline-none focus:ring-4 focus:ring-yellow-600/50">
                    Return
                </a> {% endcomment %}
                <button onclick="history.back();" class="px-8 py-4 text-lg font-semibold text-gray-900 bg-yellow-500 rounded-xl hover:bg-yellow-600 transition duration-300 shadow-lg shadow-yellow-500/30 transform hover:scale-[1.03] active:scale-[0.98] focus:outline-none focus:ring-4 focus:ring-yellow-600/50">
                    Go Back
                </button>
                <button onclick="window.location.reload();" class="px-8 py-4 text-lg font-semibold text-white bg-gray-700 rounded-xl hover:bg-gray-600 transition duration-300 shadow-md transform hover:scale-[1.03] active:scale-[0.98] focus:outline-none focus:ring-4 focus:ring-gray-600/50">
                    Re-Hammer
                </button>
            </div>
        </div>
    </div>
</body>
</html>
